plugins {
	id 'fabric-loom' version '1.17.12'
	id 'java'
	id 'maven-publish'
}

configurations {
	shade
	implementation.extendsFrom(shade)
}

base {
	archivesName = project.archives_base_name
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

repositories {
	maven { url 'https://jitpack.io' }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	mavenCentral()
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API modules used directly by this mod.
	modImplementation "net.fabricmc.fabric-api:fabric-command-api-v2:${project.fabric_command_api_v2_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_lifecycle_events_v1_version}"

	//General config library
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu integration is optional; do not pull it into the dev/runtime remap classpath.
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
	compileOnly "com.google.code.findbugs:jsr305:3.0.1"

	//General compression library
	shade "org.apache.commons:commons-compress:1.28.0"
	shade "commons-codec:commons-codec:1.19.0"
	shade "commons-io:commons-io:2.20.0"
	shade "org.apache.commons:commons-lang3:3.19.0"

	//LZMA support
	shade 'org.tukaani:xz:1.9'

	//Gzip compression, parallel, GITHUB
	shade("com.github.shevek:parallelgzip:af5f5c297e735f3f2df7aa4eb0e19a5810b8aff6") {
		transitive = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

tasks.withType(JavaExec).configureEach {
	classpath += configurations.shade
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from {
		configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
	} {
		exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/MANIFEST.MF", "module-info.class"
	}

	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}

	from("Copyright_Notice")
}
// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven

		maven {
			name = 'myRepo'
			url = layout.buildDirectory.dir("repo")
		}
	}
}

